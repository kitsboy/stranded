name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npx playwright install chromium --with-deps

      - run: npm test

      # Read-only docs check. The previous version ran `npm run docs:sync` and
      # let it rewrite tracked files inside CI, which could never fail — the
      # step was cosmetic. We now snapshot the tracked outputs it owns,
      # regenerate them, and fail if anything other than the by-design build
      # clock changed.
      #
      # A plain `git diff --exit-code` cannot be used here: the generator stamps
      # generatedAt/buildId (the build time) into every file it writes
      # (scripts/generate-live-stats.js, scripts/sync-docs.js), so a byte-diff
      # is dirty after every single run and the check would be permanently red.
      # The `commit`/`commitShort` deploy markers are normalised for the same
      # reason PLUS a structural one: a committed file can never name the commit
      # that contains it (the sha does not exist until after the file is
      # written), so the checked-in value is always one commit behind. Real
      # content drift — a changed dataset that was never regenerated — still
      # shows up, because only clock/provenance fields are normalised away.
      - name: Docs in sync (read-only check)
        run: |
          set -euo pipefail
          FILES="public/data/live-stats.json public/status.json docs/LIVE-STATS.md docs/SOURCE-OF-TRUTH.md docs/DOCUMENTATION.md STATUS.md README.md"
          rm -rf /tmp/docs-before && mkdir -p /tmp/docs-before
          for f in $FILES; do
            mkdir -p "/tmp/docs-before/$(dirname "$f")"
            cp "$f" "/tmp/docs-before/$f"
          done

          npm run docs:sync

          normalise() {
            sed -E \
              -e 's/[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?Z/<timestamp>/g' \
              -e 's/"buildId": *"[0-9]+"/"buildId": "<id>"/g' \
              -e 's/"commit": *"[^"]*"/"commit": "<sha>"/g' \
              -e 's/"commitShort": *"[^"]*"/"commitShort": "<sha>"/g' "$1"
          }

          failed=0
          for f in $FILES; do
            if ! diff -u <(normalise "/tmp/docs-before/$f") <(normalise "$f") > /tmp/docs-diff.txt; then
              echo "::error file=$f::generated docs are out of date — run 'npm run docs:sync' locally and commit the result"
              cat /tmp/docs-diff.txt
              failed=1
            fi
          done
          exit $failed

      - run: npm run lint

      - run: npm run build

      - name: Verify static output
        run: |
          test -f dist/index.html
          test -d dist/map && test -f dist/map/index.html
          test -d dist/pitch && test -f dist/pitch/index.html
          test -d dist/verticals && test -f dist/verticals/index.html
          test -d dist/funding && test -f dist/funding/index.html
          test -f dist/data/live-stats.json

      - name: E2E smoke tests
        run: |
          npx serve -p 3003 dist &
          sleep 3
          PLAYWRIGHT_BASE_URL=http://localhost:3003 npm run e2e

      # The map HUD bar was painted on the full-width wrapper by the substring
      # selector `.map-command-center [class*="hud"]`, which is easy to
      # reintroduce and invisible to unit tests (it is a rendered-CSS bug). This
      # checks the BUILT output served above — not the live site, which lags the
      # commit — and then runs the same check with the old rule re-injected, so
      # the verifier is proven able to fail rather than assumed to.
      - name: Map HUD regression (built output)
        run: |
          set -euo pipefail
          if ! curl -sf http://localhost:3003/map/ >/dev/null; then
            npx serve -p 3003 dist > /tmp/serve-hud.log 2>&1 &
            for i in $(seq 1 30); do
              curl -sf http://localhost:3003/map/ >/dev/null && break
              sleep 1
            done
          fi
          node scripts/verify-map-hud-bar.mjs --url http://localhost:3003/map/ --out /tmp/hud-verify
          node scripts/verify-map-hud-bar.mjs --control --url http://localhost:3003/map/ --out /tmp/hud-verify-control

      # Cloudflare Pages applies public/_headers, so a CSP mistake normally only
      # shows up in production, after a deploy. This loads the live page and
      # swaps in this commit's policy, so it is testable before it ships.
      - name: CSP policy check (against the live page)
        run: node scripts/verify-csp-headers.mjs

      - name: Upload HUD screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hud-verify
          path: |
            /tmp/hud-verify
            /tmp/hud-verify-control
          retention-days: 7
          if-no-files-found: ignore

      - name: Notify on success
        if: success() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"✅ Stranded CI passed — ${{ github.sha }}\"}" \
            "$SLACK_WEBHOOK_URL" || true

      - name: Notify on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"❌ Stranded CI failed on ${{ github.ref }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL" || true
